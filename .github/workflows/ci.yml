name: CI

on:
  push:
    branches: [claude/slime-merge-physics-sandbox-6af5z3]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30 (a test dependency) requires Node >=22.22.2 — it fails
          # at import time on Node 20 with a cryptic undici/webidl error.
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
