name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/slime-merge-physics-sandbox-6af5z3]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # Publishes dist/ to the gh-pages branch. One-time setup needed in the
      # repo itself: Settings -> Pages -> Build and deployment -> Source:
      # "Deploy from a branch" -> Branch: gh-pages / (root). After that the
      # site stays live and updates automatically on every push here.
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
