<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Slime Merge — Physics Sandbox</title>
    <!--
      Yandex Games platform SDK. Loaded synchronously (no async/defer) so
      window.YaGames is already defined by the time our module script runs.
      Outside the Yandex Games iframe this request/script simply fails to
      resolve — yandex.js treats a missing window.YaGames as "no platform"
      and no-ops instead of throwing.
    -->
    <script src="https://yandex.ru/games/sdk/v2"></script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!--
        The stage is a fixed 380x600 logical box (matches the canvas's
        drawing-buffer resolution). ui.js scales the whole box with a CSS
        transform to fit the viewport, so every child positioned in logical
        px here — the canvas, the danger line, the HUD — scales as one unit.
      -->
      <div id="stage">
        <canvas id="game-canvas" width="380" height="600"></canvas>

        <div id="hud">
          <div id="danger-line"></div>

          <div id="score-hud"><span data-i18n="score">Счёт:</span> <span id="score-value">0</span></div>

          <button
            id="pause-button"
            type="button"
            class="hidden"
            data-i18n-aria="pauseAriaLabel"
            aria-label="Пауза"
          >
            ⏸
          </button>

          <div id="next-hud">
            <div id="next-preview-circle"></div>
          </div>

          <div id="main-menu" class="overlay-screen">
            <div class="overlay-panel">
              <button id="start-button" type="button" class="panel-button" data-i18n="play">Играть</button>
              <button
                id="menu-settings-button"
                type="button"
                class="panel-button panel-button--secondary"
                data-i18n="settings"
              >
                Настройки
              </button>
            </div>
          </div>

          <div id="pause-overlay" class="overlay-screen hidden">
            <div class="overlay-panel">
              <h2 data-i18n="pausedHeading">Пауза</h2>
              <button id="resume-button" type="button" class="panel-button" data-i18n="resume">Продолжить</button>
              <button id="pause-restart-button" type="button" class="panel-button" data-i18n="restart">
                Начать заново
              </button>
              <button
                id="pause-settings-button"
                type="button"
                class="panel-button panel-button--secondary"
                data-i18n="settings"
              >
                Настройки
              </button>
            </div>
          </div>

          <div id="settings-overlay" class="overlay-screen hidden">
            <div class="overlay-panel">
              <h2 data-i18n="settings">Настройки</h2>
              <button id="sound-toggle-button" type="button" class="panel-button">Звук: вкл</button>
              <button
                id="settings-back-button"
                type="button"
                class="panel-button panel-button--secondary"
                data-i18n="back"
              >
                Назад
              </button>
            </div>
          </div>

          <div id="game-over" class="overlay-screen hidden">
            <div class="overlay-panel">
              <h2 data-i18n="gameOverHeading">Игра окончена</h2>
              <p><span data-i18n="score">Счёт:</span> <span id="final-score-value">0</span></p>
              <p><span data-i18n="bestScore">Лучший счёт:</span> <span id="best-score-value">0</span></p>
              <button id="restart-button" type="button" class="panel-button" data-i18n="playAgain">
                Играть снова
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
